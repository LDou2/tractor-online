<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda R-6 Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--wall1:#e9e1d3;--wall2:#cfc3ae;--desk1:#7a4c2c;--desk2:#4f2f19;--ink:#3d3328;--muted:#7b6d5a;--chip:#fffaf0cc}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wall1:#2a2623;--wall2:#1a1816;--desk1:#4a2f1c;--desk2:#2a190d;--ink:#efe6d6;--muted:#a3978a;--chip:#2c2724cc}}
  :root[data-theme="dark"]{--wall1:#2a2623;--wall2:#1a1816;--desk1:#4a2f1c;--desk2:#2a190d;--ink:#efe6d6;--muted:#a3978a;--chip:#2c2724cc}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--wall2);overflow-x:hidden;
    background:radial-gradient(1200px 700px at 50% 30%,var(--wall1),var(--wall2));min-height:100vh}
  .scene{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:96px 16px 0}
  .desk{position:absolute;left:0;right:0;bottom:0;height:22vh;min-height:120px;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 9px),repeating-linear-gradient(89deg,rgba(255,220,180,.05) 0 2px,transparent 2px 23px),linear-gradient(180deg,var(--desk1),var(--desk2));
    box-shadow:0 -1px 0 rgba(255,255,255,.25),0 -14px 30px rgba(0,0,0,.18)}
  .desk::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(rgba(255,255,255,.18),transparent)}
  .stage{position:relative;z-index:1;margin-bottom:calc(22vh - 34px)}
  @media (max-height:700px){.stage{margin-bottom:90px}}
  .stage::after{content:'';position:absolute;left:8%;right:8%;bottom:-18px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);z-index:-1}
  header{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px;z-index:2}
  h1{margin:0;font:800 15px/1 Inter;letter-spacing:.32em;text-transform:uppercase}
  h1 span{display:block;margin-top:6px;font:500 11px/1.3 Inter;letter-spacing:.02em;text-transform:none;color:var(--muted)}
  .bar{display:flex;gap:6px;flex-wrap:wrap;background:var(--chip);backdrop-filter:blur(8px);padding:5px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .bar button{font:600 12px Inter;color:var(--ink);background:transparent;border:0;padding:7px 11px;border-radius:8px;cursor:pointer}
  .bar button[aria-pressed=true]{background:var(--ink);color:var(--wall1)}
  .app{display:none;position:fixed;inset:84px 40px 40px;border-radius:14px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;z-index:1;color:#333}
  .app .tb{height:38px;background:#f1f1f1;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;gap:7px;padding:0 14px}
  .app .tb i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.app .tb i:nth-child(2){background:#febc2e}.app .tb i:nth-child(3){background:#28c840}
  .app .ct{padding:28px;display:grid;gap:14px}
  .app .ln{height:12px;border-radius:6px;background:#ececec}
  .app p{margin:0;color:#888;font-size:13px}
  body.floating .app{display:block}
  body.floating .stage{visibility:hidden}
  /* Wall pictures (desk view). Painted for this project, free to share. */
  body[data-wall=beach]{background:#f3b48a url(walls/beach.svg) center 30%/cover no-repeat fixed}
  body[data-wall=marble]{background:#e9eef6 url(walls/marble.svg) center/cover no-repeat fixed}
  body[data-wall=spring]{background:#9fc0e0 url(walls/spring-train.gif) center 62%/cover no-repeat fixed}
  body[data-wall=evening]{background:#e7b79a url(walls/evening-train.gif) center 62%/cover no-repeat fixed}
  body[data-wall=mine]{background:#333 var(--mywall,none) center/cover no-repeat fixed}
  body:not([data-wall=plain]) h1{background:var(--chip);backdrop-filter:blur(8px);padding:9px 12px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .walls button{min-width:0}
  body.floating .walls{display:none}
  .stage.moved::after{display:none}
  @media (max-width:560px){header{padding:12px 16px}.app{inset:110px 16px 16px}}
</style>
</head>
<body data-wall="marble">
<div class="scene">
  <header>
    <h1>Panda R-6<span>AM · FM · MP3 · Bluetooth · drag the handle or speaker to move it</span></h1>
    <div class="tools">
    <div class="bar walls" role="group" aria-label="Wall picture">
      <button data-wall="plain" aria-pressed="false">Plain wall</button>
      <button data-wall="beach" aria-pressed="false">Beach</button>
      <button data-wall="marble" aria-pressed="true">Marble</button>
      <button data-wall="spring" aria-pressed="false" title="皖南 rapeseed fields, spring morning">Spring train</button>
      <button data-wall="evening" aria-pressed="false" title="皖南 rapeseed fields, golden evening">Evening train</button>
      <button data-wall="mine" aria-pressed="false" title="Use your own picture (stays private in this browser). Click again to change it.">My picture…</button>
      <input type="file" accept="image/*" hidden id="wallFile">
    </div>
    <div class="bar views" role="group" aria-label="View">
      <button data-view="desk" aria-pressed="true">On the desk</button>
      <button data-view="bottom-left" aria-pressed="false">Float ↙</button>
      <button data-view="bottom-right" aria-pressed="false">Float ↘</button>
      <button data-view="mini" aria-pressed="false">Mini</button>
    </div>
    </div>
  </header>

  <div class="app" aria-hidden="true">
    <div class="tb"><i></i><i></i><i></i></div>
    <div class="ct">
      <p>Pretend this is another app. The radio floats over it — drag it by its handle to any corner.</p>
      <div class="ln" style="width:62%"></div><div class="ln" style="width:88%"></div><div class="ln" style="width:74%"></div>
      <div class="ln" style="width:40%"></div><div class="ln" style="width:81%"></div>
    </div>
  </div>

  <div class="stage"><retro-radio id="radio" movable></retro-radio></div>
  <div class="desk"></div>
</div>

<!-- Optional: songs bundled with the app (see README). Missing file is fine. -->
<script src="songs/playlist.js" onerror="this.remove()"></script>
<script src="radio.js"></script>
<script>
  const radio = document.getElementById('radio');
  const stage = document.querySelector('.stage');
  const fit = () => {
    if (radio.hasAttribute('floating')) return;
    const vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight;
    const z = Math.min(1.35, (vw - 32) / 520, (vh - 150) / 520);
    radio.setAttribute('scale', Math.max(0.55, z).toFixed(3));
  };
  function setView(v) {
    document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
    const floating = v !== 'desk';
    document.body.classList.toggle('floating', floating);
    radio.toggleAttribute('floating', floating);
    radio.toggleAttribute('mini', v === 'mini');
    if (floating) {
      if (v !== 'mini') radio.setAttribute('corner', v);
      else if (!radio.getAttribute('corner')) radio.setAttribute('corner', 'bottom-right');
      radio.setAttribute('scale', innerWidth < 600 ? '0.62' : '0.72');
      document.body.appendChild(radio);
    } else {
      stage.appendChild(radio); fit();
    }
  }
  document.querySelector('.views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });
  radio.addEventListener('radio-corner', e => {
    document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === (radio.hasAttribute('mini') ? 'mini' : e.detail.corner)));
  });
  addEventListener('resize', fit); fit();
  // keep the radio below the header buttons so its handle can always be grabbed
  const safeTop = () => radio.setAttribute('safe-top', Math.ceil(document.querySelector('header').getBoundingClientRect().bottom + 4));
  safeTop(); addEventListener('resize', safeTop);
  const moved = (p) => stage.classList.toggle('moved', !!(p && (p.x || p.y)));
  radio.addEventListener('radio-move', e => moved(e.detail)); moved(radio._pos);

  // ---- Wall picture switcher (choice remembered; "My picture" is kept in this browser only) ----
  const WALL_KEY = 'panda-r6:wall', fileIn = document.getElementById('wallFile');
  const db = () => new Promise((ok, no) => { const r = indexedDB.open('panda-r6-wall', 1); r.onupgradeneeded = () => r.result.createObjectStore('pic'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const picGet = async () => { try { const d = await db(); return await new Promise((ok) => { const q = d.transaction('pic').objectStore('pic').get('mine'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
  const picSet = async (blob) => { try { const d = await db(); d.transaction('pic', 'readwrite').objectStore('pic').put(blob, 'mine'); } catch (e) {} };
  let picUrl = null;
  const showPic = (blob) => { if (picUrl) URL.revokeObjectURL(picUrl); picUrl = URL.createObjectURL(blob); document.body.style.setProperty('--mywall', `url("${picUrl}")`); };
  function setWall(w) {
    document.body.dataset.wall = w;
    document.querySelectorAll('.walls button').forEach(b => b.setAttribute('aria-pressed', b.dataset.wall === w));
    try { localStorage.setItem(WALL_KEY, w); } catch (e) {}
  }
  document.querySelector('.walls').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.wall !== 'mine') return setWall(b.dataset.wall);
    // first time, or clicked again while showing: choose a picture
    if (!picUrl || document.body.dataset.wall === 'mine') return fileIn.click();
    setWall('mine');
  });
  fileIn.addEventListener('change', () => { const f = fileIn.files[0]; if (!f) return; showPic(f); picSet(f); setWall('mine'); fileIn.value = ''; });
  (async () => {
    let w = 'marble'; try { w = localStorage.getItem(WALL_KEY) || 'marble'; } catch (e) {}
    const pic = await picGet(); if (pic) showPic(pic);
    setWall(w === 'mine' && !pic ? 'marble' : w);
  })();
</script>
</body>
</html>
